[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlua"
version = "0.1.0"
description = "Multilayer GNN experiments for energy-efficient user association"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

